<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 300" role="img" aria-labelledby="title desc">
  <title id="title">Uncertainty quantification overview</title>
  <desc id="desc">Bootstrap resampling creates a distribution of accuracy values, while class probabilities form per-class histograms for reviewing confidence.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#111827"/><stop offset="1" stop-color="#1e1b4b"/></linearGradient>
    <linearGradient id="bar" x1="0" x2="1"><stop stop-color="#22d3ee"/><stop offset="1" stop-color="#8b5cf6"/></linearGradient>
  </defs>
  <rect width="1100" height="300" rx="24" fill="url(#bg)"/>
  <text x="42" y="46" fill="#fff" font-family="Inter,Segoe UI,sans-serif" font-size="21" font-weight="700">Uncertainty is a distribution, not a single score</text>
  <text x="42" y="71" fill="#a5b4fc" font-family="Inter,Segoe UI,sans-serif" font-size="13">The notebook combines resampling-based variation with per-class probability inspection.</text>
  <g transform="translate(48,104)">
    <text x="0" y="0" fill="#fbbf24" font-family="Inter,Segoe UI,sans-serif" font-size="14" font-weight="700">BOOTSTRAP ACCURACY</text>
    <line x1="0" y1="112" x2="430" y2="112" stroke="#475569" stroke-width="2"/>
    <g fill="url(#bar)" opacity=".9">
      <rect x="24" y="74" width="22" height="38" rx="4"/><rect x="54" y="50" width="22" height="62" rx="4"/><rect x="84" y="30" width="22" height="82" rx="4"/><rect x="114" y="17" width="22" height="95" rx="4"/><rect x="144" y="10" width="22" height="102" rx="4"/><rect x="174" y="18" width="22" height="94" rx="4"/><rect x="204" y="34" width="22" height="78" rx="4"/><rect x="234" y="51" width="22" height="61" rx="4"/><rect x="264" y="72" width="22" height="40" rx="4"/><rect x="294" y="89" width="22" height="23" rx="4"/><rect x="324" y="99" width="22" height="13" rx="4"/>
    </g>
    <line x1="62" y1="126" x2="324" y2="126" stroke="#fbbf24" stroke-width="3"/>
    <text x="0" y="151" fill="#c7d2fe" font-family="Inter,Segoe UI,sans-serif" font-size="12">mean accuracy</text><text x="280" y="151" fill="#c7d2fe" font-family="Inter,Segoe UI,sans-serif" font-size="12">95% interval</text>
  </g>
  <g transform="translate(610,104)">
    <text x="0" y="0" fill="#67e8f9" font-family="Inter,Segoe UI,sans-serif" font-size="14" font-weight="700">CLASS PROBABILITIES</text>
    <line x1="0" y1="112" x2="430" y2="112" stroke="#475569" stroke-width="2"/>
    <g fill="#22d3ee"><rect x="24" y="75" width="25" height="37" rx="4"/><rect x="58" y="56" width="25" height="56" rx="4"/><rect x="92" y="26" width="25" height="86" rx="4"/><rect x="126" y="43" width="25" height="69" rx="4"/><rect x="160" y="68" width="25" height="44" rx="4"/></g>
    <g fill="#f472b6"><rect x="220" y="97" width="25" height="15" rx="4"/><rect x="254" y="89" width="25" height="23" rx="4"/><rect x="288" y="72" width="25" height="40" rx="4"/><rect x="322" y="42" width="25" height="70" rx="4"/><rect x="356" y="18" width="25" height="94" rx="4"/></g>
    <text x="0" y="151" fill="#c7d2fe" font-family="Inter,Segoe UI,sans-serif" font-size="12">low-confidence spread</text><text x="290" y="151" fill="#c7d2fe" font-family="Inter,Segoe UI,sans-serif" font-size="12">high-confidence peak</text>
  </g>
</svg>
